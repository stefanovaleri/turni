<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1a24">
<title>L'impostore</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* Stile "fascicolo da detective": scrivania scura, schede di carta, macchina da scrivere, timbri */
  :root {
    --scrivania: #1c1a24; --lampada: #3a3446;
    --carta: #f1e4c3; --carta-scura: #e3cf9f; --inchiostro: #2b2118; --sbiadito: #6d5c45; --bordo: #c9b383;
    --timbro: #b8302a; --evid: #f5c84c; --verde: #2e7d4f;
    --muted: #b9ae98; --title: var(--carta);
    --macchina: "Special Elite", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--carta); font: 16px/1.45 Roboto, Tahoma, system-ui, sans-serif;
    background: var(--scrivania) radial-gradient(ellipse 120% 60% at 50% -10%, var(--lampada) 0%, var(--scrivania) 70%) no-repeat;
  }
  /* nastro da scena del crimine */
  .band { height: 14px; background: repeating-linear-gradient(-45deg, var(--evid) 0 14px, #15131b 14px 28px); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; }
  h1, h2, .big, .label { font-family: var(--macchina); font-weight: 400; }
  header { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
  header h1 { font-size: 1.7rem; margin: 0; color: var(--carta); line-height: 1.1; letter-spacing: .02em; }
  header p { margin: 3px 0 0; color: var(--muted); font-size: .9rem; }
  header .esci { margin-left: auto; }
  .chip-logo { width: 52px; height: 52px; flex: none; border-radius: 50%; background: var(--carta); display: grid; place-items: center; font-size: 28px; box-shadow: 0 0 0 3px var(--scrivania), 0 0 0 5px var(--evid); }
  h2 { font-size: 1.05rem; color: var(--evid); margin: 26px 0 8px; text-transform: uppercase; letter-spacing: .12em; }
  .label { font-size: .85rem; text-transform: uppercase; letter-spacing: .14em; color: var(--evid); }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  p { margin: 0 0 10px; }
  b { font-weight: 700; }

  /* schede di carta */
  .card, .sospetto, .carta.coperta {
    --muted: var(--sbiadito); --title: var(--inchiostro);
    color: var(--inchiostro); background-color: var(--carta);
    background-image: linear-gradient(transparent 0 27px, rgba(43,33,24,.07) 27px 28px); background-size: 100% 28px;
    border-radius: 3px; box-shadow: 0 8px 18px rgba(0,0,0,.45), inset 0 0 40px rgba(120,90,40,.12);
  }
  .card { padding: 16px; margin-bottom: 12px; border: 0; }
  .card h2, .card .label { color: var(--timbro); }
  ol.regole { margin: 0 0 10px; padding-left: 1.4em; }
  ol.regole li { margin-bottom: 6px; }
  ol.regole li::marker { font-family: var(--macchina); color: var(--timbro); }

  label { display: block; font-weight: 500; margin: 12px 0 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font: 1.1rem var(--macchina); color: var(--inchiostro);
    background: #fffaf0; border: 2px solid var(--inchiostro); border-radius: 3px;
  }
  input::placeholder { color: #a8987c; }
  input.codice { text-transform: uppercase; letter-spacing: .3em; }
  button { font: inherit; cursor: pointer; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 3px; padding: 14px 18px; margin-top: 14px;
    font: 1.15rem var(--macchina); text-transform: uppercase; letter-spacing: .1em;
    background: var(--timbro); color: #fff; box-shadow: 0 4px 0 #7a1d19;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a1d19; }
  .btn.verde { background: var(--evid); color: var(--inchiostro); box-shadow: 0 4px 0 #a7852a; }
  .btn.chiaro { background: transparent; color: var(--carta); border: 2px solid var(--carta); box-shadow: none; }
  .card .btn.chiaro { color: var(--inchiostro); border-color: var(--inchiostro); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .link { background: none; border: 0; padding: 6px 8px; color: var(--muted); text-decoration: underline; font-size: .9rem; }
  .riga { display: flex; gap: 10px; }
  .riga .btn { flex: 1; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--evid); outline-offset: 2px; }

  .rete { background: var(--evid); color: var(--inchiostro); border-radius: 3px; padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; transform: rotate(-.6deg); box-shadow: 0 4px 10px rgba(0,0,0,.4); }

  .invito { text-align: center; }
  .invito .big { font-size: 3rem; letter-spacing: .25em; color: var(--timbro); margin: 4px 0; }
  .qr { width: 190px; height: 190px; margin: 8px auto; background: #fff; padding: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .qr svg { width: 100%; height: 100%; display: block; }

  /* il timbro */
  .timbro {
    display: inline-block; font-family: var(--macchina); text-transform: uppercase; letter-spacing: .12em;
    color: var(--timbro); border: 3px double var(--timbro); border-radius: 4px; padding: 4px 12px;
    transform: rotate(-7deg); opacity: .88; mix-blend-mode: multiply;
  }

  /* La carta con l'immagine segreta: fascicolo chiuso, oppure Polaroid fissata con lo scotch */
  .carta { display: block; width: 100%; color: inherit; text-align: center; border: 0; margin: 14px 0 16px; min-height: 210px; position: relative; }
  .carta.polaroid {
    background: #fdfcf7; color: var(--inchiostro); padding: 16px 16px 20px; transform: rotate(-1.5deg);
    box-shadow: 0 10px 22px rgba(0,0,0,.5);
  }
  .carta.polaroid::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px;
    background: rgba(245,200,76,.55); transform: rotate(3deg);
  }
  .carta .foto { display: block; background: #e9e4d6; padding: 10px 0; margin-bottom: 12px; }
  .carta .emoji { font-size: 100px; line-height: 1.1; display: block; }
  .carta .nome-img { font: 1.6rem var(--macchina); color: var(--inchiostro); }
  .carta .nota { font-size: .85rem; color: var(--sbiadito); margin-top: 6px; }
  .carta.coperta { display: grid; place-items: center; align-content: center; gap: 12px; padding: 26px 16px 18px; background-color: var(--carta-scura); }
  .carta.coperta::before {
    content: ""; position: absolute; top: -14px; left: 0; width: 42%; height: 16px;
    background: var(--carta-scura); border-radius: 6px 6px 0 0;
  }
  .carta.coperta .timbro { font-size: 2rem; }
  .carta.coperta .nome-img { font-size: 1.15rem; }

  .giocatori { list-style: none; padding: 0; margin: 0; }
  .giocatori li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--bordo); }
  .giocatori li:last-child { border-bottom: 0; }
  .giocatori .nome { flex: 1; font-weight: 500; overflow-wrap: anywhere; }
  .giocatori .off { opacity: .5; }
  .giocatori .punti { font: 1.15rem var(--macchina); }
  .giocatori .x { background: none; border: 0; color: var(--sbiadito); font-size: 1.1rem; padding: 2px 6px; }
  .stato { font-size: .85rem; color: var(--sbiadito); white-space: nowrap; }
  .stato.ok { color: var(--verde); font-weight: 700; }

  /* indizi: parole a macchina, evidenziate */
  .indizi { list-style: none; padding: 0; margin: 0; }
  .indizi li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--bordo); }
  .indizi li:last-child { border-bottom: 0; }
  .indizi .chi { flex: 1; overflow-wrap: anywhere; }
  .parola { font: 1.2rem var(--macchina); color: var(--inchiostro); overflow-wrap: anywhere; text-align: right; }
  .parola:not(:empty) { background: linear-gradient(transparent 55%, rgba(245,200,76,.7) 55%); padding: 0 3px; }
  .indizi .ora .chi { font-weight: 700; }
  .indizi .ora .parola { background: none; color: var(--timbro); font-size: .95rem; }
  .indizi .dopo { opacity: .45; }

  .sospetto {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; position: relative;
    border: 0; padding: 13px 14px; margin-bottom: 10px; font-size: 1.05rem;
  }
  .sospetto .chi { flex: 1; font-weight: 500; overflow-wrap: anywhere; }
  .sospetto.scelta { outline: 3px solid var(--timbro); outline-offset: -3px; }
  .sospetto.scelta::after { content: "Sospetto"; position: absolute; right: 38%; top: 50%; margin-top: -.9em; font-size: .95rem; }
  .sospetto.scelta::after, .tag {
    font-family: var(--macchina); text-transform: uppercase; letter-spacing: .1em; color: var(--timbro);
    border: 2px solid var(--timbro); border-radius: 3px; padding: 1px 8px; transform: rotate(-8deg); background: none;
  }
  .tag { display: inline-block; font-size: .8rem; margin-left: 8px; vertical-align: middle; }
  .sospetto.imp { outline: 3px solid var(--timbro); outline-offset: -3px; }

  .esito { text-align: center; font: 1.3rem var(--macchina); padding: 16px 14px; border-radius: 3px; margin-bottom: 14px; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
  .esito .small { font-family: Roboto, Tahoma, sans-serif; }
  .esito.si { background: var(--evid); color: var(--inchiostro); }
  .esito.no { background: var(--timbro); color: #fff; }
  .domanda { font-size: 1.5rem; margin: 6px 0 14px; color: var(--carta); line-height: 1.25; }
  .domanda b { font-weight: 400; color: var(--evid); }
  .coppia { display: flex; gap: 12px; margin: 6px 0 12px; }
  .coppia .card { flex: 1; text-align: center; margin: 0; padding: 10px 8px 12px; background: #fdfcf7; transform: rotate(-1.5deg); }
  .coppia .card + .card { transform: rotate(1.8deg); }
  .coppia .emoji { font-size: 58px; line-height: 1.2; display: block; background: #e9e4d6; margin: 6px 0 8px; }
  .coppia .nome-img { font-family: var(--macchina); }
  .coppia .imp { outline: 3px solid var(--timbro); }
</style>
</head>
<body>
<div class="band"></div>
<main>
  <div id="s-rete"></div>
  <div id="s-testa"></div>
  <div id="s-carta"></div>
  <div id="s-gioco"></div>
  <div id="s-lista"></div>
  <div id="s-azioni"></div>
  <noscript>Per giocare serve JavaScript.</noscript>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// L'impostore: tutti vedono la stessa immagine, tranne uno che ne vede una
// simile ma diversa (e non sa di essere l'impostore). A turno ognuno dice una
// parola, poi si vota chi è l'impostore.
//
// Rete come in ../bugia/: il telefono del capo partita tiene lo stato e manda a
// ognuno una vista che contiene solo la sua immagine, finché non si svela.
// ---------------------------------------------------------------------------
const PREFISSO = "agesci-turni-impostore-";
const ALFABETO = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const MAX_NOME = 20, MAX_PAROLA = 24, MIN_GIOCATORI = 3;

// Coppie di immagini simili: una va alla ciurma, l'altra all'impostore (a caso).
const COPPIE = [
  [["🏕️", "Tenda"], ["🛖", "Capanna"]],
  [["🎒", "Zaino"], ["🧳", "Valigia"]],
  [["🧭", "Bussola"], ["⌚", "Orologio"]],
  [["🛶", "Canoa"], ["⛵", "Barca a vela"]],
  [["🔦", "Torcia"], ["🕯️", "Candela"]],
  [["🗺️", "Mappa"], ["📖", "Libro"]],
  [["🥾", "Scarponi"], ["👟", "Scarpe da ginnastica"]],
  [["🪓", "Accetta"], ["🔨", "Martello"]],
  [["🌲", "Abete"], ["🌴", "Palma"]],
  [["🏔️", "Montagna"], ["🌋", "Vulcano"]],
  [["🌙", "Luna"], ["☀️", "Sole"]],
  [["🌧️", "Pioggia"], ["❄️", "Neve"]],
  [["🐺", "Lupo"], ["🦊", "Volpe"]],
  [["🦉", "Gufo"], ["🦅", "Aquila"]],
  [["🐻", "Orso"], ["🐼", "Panda"]],
  [["🐝", "Ape"], ["🦋", "Farfalla"]],
  [["🐍", "Serpente"], ["🐛", "Bruco"]],
  [["🐟", "Pesce"], ["🐬", "Delfino"]],
  [["🦆", "Anatra"], ["🐔", "Gallina"]],
  [["🌻", "Girasole"], ["🌹", "Rosa"]],
  [["🍕", "Pizza"], ["🍔", "Hamburger"]],
  [["🍝", "Spaghetti"], ["🍚", "Riso"]],
  [["🍦", "Gelato"], ["🍫", "Cioccolato"]],
  [["🍎", "Mela"], ["🍐", "Pera"]],
  [["🚂", "Treno"], ["🚌", "Pullman"]],
  [["🚲", "Bicicletta"], ["🛴", "Monopattino"]],
  [["⚽", "Calcio"], ["🏀", "Pallacanestro"]],
  [["🎸", "Chitarra"], ["🎻", "Violino"]],
  [["🏰", "Castello"], ["⛪", "Chiesa"]],
  [["🧤", "Guanti"], ["🧦", "Calzini"]],
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const leggi = (k, area = localStorage) => { try { return JSON.parse(area.getItem(k)); } catch { return null; } };
const scrivi = (k, v, area = localStorage) => { try { v == null ? area.removeItem(k) : area.setItem(k, JSON.stringify(v)); } catch {} };
const mescola = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const caso = n => Math.floor(Math.random() * n);
const nuovoCodice = () => Array.from({ length: 4 }, () => ALFABETO[caso(ALFABETO.length)]).join("");
const pulisci = (s, max) => String(s ?? "").replace(/\s+/g, " ").trim().slice(0, max);
const normale = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const immagine = ([emoji, nome]) => ({ emoji, nome });

let mioId = leggi("impostore-id");
if (!mioId) { mioId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); scrivi("impostore-id", mioId); }
let mioNome = leggi("impostore-nome") || "";

let ruolo = null;          // null (schermata iniziale) | "host" | "ospite"
let codice = null;
let peer = null;
let rete = "attesa";       // "ok" | "attesa" | "persa" | "assente"
let vista = null;          // ultima vista ricevuta (o calcolata, per l'host)
let bozzaHome = { nome: mioNome, codice: "" };
let bozzaParola = "";
let scoperta = null;       // numero del round in cui ho scoperto la carta

// ------------------------------- Host ---------------------------------------
let S = null;              // stato completo della partita (solo sull'host)
const conns = new Map();   // DataConnection -> id giocatore
let timerSvela = null, wakeLock = null;

function online() {
  const s = new Set(conns.values());
  s.add(mioId);
  return s;
}
function salvaHost() { S.t = Date.now(); scrivi("impostore-host", S); }
const diTurno = () => S.fase === "indizi" ? S.ordine[S.turno] : null;
function immagineDi(id) {
  if (!S.ordine.includes(id)) return null;
  const c = COPPIE[S.coppia];
  return immagine(c[id === S.imp ? 1 - S.lato : S.lato]);
}

function vistaPer(id) {
  const on = online();
  const v = {
    codice: S.codice, fase: S.fase, io: id, host: mioId, round: S.round,
    giocatori: Object.entries(S.giocatori).map(([gid, g]) => ({
      id: gid, nome: g.nome, punti: g.punti, online: on.has(gid),
      inRound: S.ordine.includes(gid), votato: S.fase === "voto" && gid in S.voti,
    })),
    ordine: S.ordine, turno: diTurno(), indizi: S.indizi,
    mia: S.fase === "indizi" || S.fase === "voto" ? immagineDi(id) : null,
    mioVoto: S.voti[id] ?? null, svela: null,
  };
  if (S.fase === "svela") {
    const c = COPPIE[S.coppia];
    v.svela = { imp: S.imp, ciurma: immagine(c[S.lato]), impostore: immagine(c[1 - S.lato]), voti: S.voti, preso: S.preso, guadagni: S.guadagni };
  }
  return v;
}

function trasmetti() {
  salvaHost();
  for (const [c, id] of conns) {
    if (c.open) { try { c.send({ t: "stato", s: vistaPer(id) }); } catch {} }
  }
  vista = vistaPer(mioId);
  render();
}

function nuovoRound() {
  const presenti = [...online()].filter(id => S.giocatori[id]);
  if (presenti.length < MIN_GIOCATORI) return false;
  let libere = COPPIE.map((_, i) => i).filter(i => !S.usate.includes(i));
  if (!libere.length) { S.usate = []; libere = COPPIE.map((_, i) => i); }
  S.coppia = libere[caso(libere.length)];
  S.usate.push(S.coppia);
  S.lato = caso(2);
  S.ordine = mescola(presenti);
  S.imp = S.ordine[caso(S.ordine.length)];
  S.turno = 0; S.indizi = []; S.voti = {}; S.preso = null; S.guadagni = {};
  S.round++;
  S.fase = "indizi";
  return true;
}

function prossimoIndizio() {
  S.turno++;
  if (S.turno >= S.ordine.length) { S.fase = "voto"; controllaVoti(); }
}

function svela() {
  clearTimeout(timerSvela);
  if (S.fase !== "voto") return;
  const conta = {};
  for (const [v, x] of Object.entries(S.voti)) if (S.giocatori[v]) conta[x] = (conta[x] || 0) + 1;
  const max = Math.max(0, ...Object.values(conta));
  const primi = Object.keys(conta).filter(k => conta[k] === max);
  S.preso = max > 0 && primi.length === 1 && primi[0] === S.imp;
  S.guadagni = {};
  const dai = (id, n) => { if (S.giocatori[id]) { S.giocatori[id].punti += n; S.guadagni[id] = (S.guadagni[id] || 0) + n; } };
  for (const [v, x] of Object.entries(S.voti)) if (v !== S.imp && x === S.imp) dai(v, 1);   // ha votato l'impostore
  if (!S.preso) dai(S.imp, 2);                                                               // l'impostore l'ha fatta franca
  S.fase = "svela";
}

function controllaVoti() {
  clearTimeout(timerSvela);
  if (S.fase !== "voto") return;
  const on = online();
  const elettori = S.ordine.filter(id => on.has(id) && S.giocatori[id]);
  if (elettori.length && elettori.every(id => id in S.voti)) {
    timerSvela = setTimeout(() => { if (S.fase === "voto") { svela(); trasmetti(); } }, 2000);
  }
}

// Azioni dei giocatori (anche dell'host stesso). Restituisce true se lo stato è cambiato.
function azione(id, m) {
  const g = S.giocatori[id];
  if (!g || !m) return false;
  const capo = id === mioId;
  switch (m.t) {
    case "indizio": {
      if (id !== diTurno()) return false;
      const p = pulisci(m.p, MAX_PAROLA);
      if (!p) return false;
      S.indizi.push({ id, p });
      prossimoIndizio();
      return true;
    }
    case "voto": {
      if (S.fase !== "voto" || !S.ordine.includes(id)) return false;
      if (m.id === id || !S.ordine.includes(m.id)) return false;
      S.voti[id] = m.id;
      controllaVoti();
      return true;
    }
    case "inizia": {
      if (!capo || !["lobby", "svela"].includes(S.fase)) return false;
      if (S.fase === "lobby") for (const k in S.giocatori) S.giocatori[k].punti = 0;
      return nuovoRound();
    }
    case "salta":
      if (!capo || S.fase !== "indizi") return false;
      prossimoIndizio();
      return true;
    case "vota":
      if (!capo || S.fase !== "indizi") return false;
      S.fase = "voto";
      controllaVoti();
      return true;
    case "svela":
      if (!capo) return false;
      svela();
      return true;
    case "fine":
      if (!capo || S.fase !== "svela") return false;
      S.fase = "fine";
      return true;
    case "ancora":
      if (!capo || S.fase !== "fine") return false;
      for (const k in S.giocatori) S.giocatori[k].punti = 0;
      Object.assign(S, { fase: "lobby", round: 0, ordine: [], indizi: [], voti: {} });
      return true;
    case "rimuovi": {
      if (!capo || m.id === mioId || online().has(m.id)) return false;
      if (S.fase === "indizi" || S.fase === "voto") return false;
      delete S.giocatori[m.id];
      return true;
    }
  }
  return false;
}

function daOspite(c, m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "ciao") {
    const id = pulisci(m.id, 64), nome = pulisci(m.nome, MAX_NOME);
    if (!id || !nome || id === mioId) { try { c.close(); } catch {} return; }
    for (const [altra, gid] of conns) if (gid === id && altra !== c) { conns.delete(altra); try { altra.close(); } catch {} }
    conns.set(c, id);
    if (S.giocatori[id]) S.giocatori[id].nome = nome;
    else S.giocatori[id] = { nome, punti: 0 };
    controllaVoti();
    trasmetti();
    return;
  }
  const id = conns.get(c);
  if (id && azione(id, m)) trasmetti();
}

function apriHost() {
  rete = "attesa";
  peer = new Peer(PREFISSO + codice);
  peer.on("open", () => { rete = "ok"; render(); });
  peer.on("connection", c => {
    c.on("data", m => daOspite(c, m));
    const chiudi = () => {
      if (!conns.has(c)) return;
      conns.delete(c);
      controllaVoti();
      trasmetti();
    };
    c.on("close", chiudi);
    c.on("error", chiudi);
  });
  peer.on("disconnected", () => {
    rete = "persa"; render();
    setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500);
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id") {
      // Il server ricorda ancora il vecchio collegamento (es. dopo un ricaricamento): riprovo.
      peer.destroy(); rete = "attesa"; render();
      setTimeout(apriHost, 3000);
    } else if (["network", "server-error", "socket-error", "socket-closed"].includes(e.type)) {
      rete = "persa"; render();
      setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 3000);
    }
  });
}

function avviaHost(salvato) {
  ruolo = "host";
  if (salvato) { S = salvato; codice = S.codice; }
  else {
    codice = nuovoCodice();
    S = { codice, fase: "lobby", giocatori: {}, round: 0, usate: [], coppia: 0, lato: 0, imp: null,
          ordine: [], turno: 0, indizi: [], voti: {}, preso: null, guadagni: {} };
  }
  S.giocatori[mioId] ??= { nome: mioNome, punti: 0 };
  S.giocatori[mioId].nome = mioNome;
  scrivi("impostore-ruolo", { ruolo, codice }, sessionStorage);
  history.replaceState(null, "", location.pathname);
  tieniAcceso();
  apriHost();
  trasmetti();
}

async function tieniAcceso() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}

// ------------------------------ Ospite --------------------------------------
let conn = null, timerRiprova = null;

function riprova(ms) {
  clearTimeout(timerRiprova);
  timerRiprova = setTimeout(connetti, ms);
}

function connetti() {
  clearTimeout(timerRiprova);
  if (ruolo !== "ospite" || !peer || peer.destroyed) return;
  if (conn && conn.open) return;
  if (peer.disconnected) { peer.reconnect(); riprova(4000); return; }
  if (!peer.open) { riprova(1000); return; }
  if (conn) { try { conn.close(); } catch {} }
  const c = peer.connect(PREFISSO + codice, { reliable: true });
  conn = c;
  riprova(8000);   // se non si apre entro 8 s, ritento
  c.on("open", () => {
    if (conn !== c) return;
    clearTimeout(timerRiprova);
    rete = "ok";
    c.send({ t: "ciao", id: mioId, nome: mioNome });
    render();
  });
  c.on("data", m => {
    if (conn !== c || !m || m.t !== "stato") return;
    vista = m.s;
    render();
  });
  const persa = () => {
    if (conn !== c) return;
    conn = null;
    if (rete === "ok") rete = "persa";
    render();
    riprova(1500);
  };
  c.on("close", persa);
  c.on("error", persa);
}

function avviaOspite(cod) {
  ruolo = "ospite"; codice = cod; rete = "attesa";
  scrivi("impostore-ruolo", { ruolo, codice }, sessionStorage);
  history.replaceState(null, "", location.pathname + "?p=" + codice);
  peer = new Peer();
  peer.on("open", () => connetti());
  peer.on("disconnected", () => setTimeout(() => { if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500));
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { rete = "assente"; conn = null; render(); riprova(3000); }
    else if (["network", "server-error", "socket-error", "socket-closed"].includes(e.type)) { rete = "persa"; render(); riprova(3000); }
  });
  render();
}

// ------------------------------ Comandi -------------------------------------
function invia(m) {
  if (ruolo === "host") { if (azione(mioId, m)) trasmetti(); }
  else if (conn && conn.open) conn.send(m);
  else alert("Non sei collegato alla partita: aspetta qualche secondo e riprova.");
}

function esci() {
  if (ruolo === "host" && !confirm("Chiudere la partita? Gli altri verranno scollegati.")) return;
  if (ruolo === "host") scrivi("impostore-host", null);
  scrivi("impostore-ruolo", null, sessionStorage);
  try { peer?.destroy(); } catch {}
  location.href = location.pathname;
}

function linkInvito() { return location.origin + location.pathname + "?p=" + codice; }

function mandaParola() {
  const p = pulisci(bozzaParola, MAX_PAROLA);
  if (!p) { alert("Scrivi il tuo indizio."); return; }
  if (p.includes(" ")) { alert("Una parola sola, senza spazi!"); return; }
  if (vista?.mia && normale(p) === normale(vista.mia.nome)) { alert("Non puoi dire proprio il nome dell'immagine!"); return; }
  bozzaParola = "";
  invia({ t: "indizio", p });
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nome") bozzaHome.nome = t.value;
  if (t.id === "cod") bozzaHome.codice = t.value;
  if (t.id === "parola") bozzaParola = t.value;
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "parola") { e.preventDefault(); mandaParola(); }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "crea" || act === "entra" || act === "riprendi") {
    const nome = pulisci(bozzaHome.nome, MAX_NOME);
    if (!nome) { alert("Scrivi il tuo nome."); $("#nome")?.focus(); return; }
    mioNome = nome; scrivi("impostore-nome", nome);
    if (act === "crea") avviaHost(null);
    else if (act === "riprendi") avviaHost(leggi("impostore-host"));
    else {
      const cod = pulisci(bozzaHome.codice, 8).toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (cod.length !== 4) { alert("Il codice della partita ha 4 caratteri."); $("#cod")?.focus(); return; }
      avviaOspite(cod);
    }
  } else if (act === "carta") { scoperta = scoperta === vista?.round ? null : vista?.round; render(); }
  else if (act === "parola") mandaParola();
  else if (act === "voto") invia({ t: "voto", id: b.dataset.id });
  else if (act === "rimuovi") invia({ t: "rimuovi", id: b.dataset.id });
  else if (["inizia", "salta", "vota", "svela", "fine", "ancora"].includes(act)) invia({ t: act });
  else if (act === "esci") esci();
  else if (act === "copia") {
    const url = linkInvito();
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(() => { b.textContent = "Link copiato ✓"; setTimeout(() => (b.textContent = "Copia link"), 2000); })
      .catch(() => prompt("Copia il link:", url));
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (ruolo === "ospite" && !(conn && conn.open)) connetti();
  if (ruolo === "host") {
    tieniAcceso();
    if (peer && !peer.destroyed && peer.disconnected) peer.reconnect();
  }
});

// ------------------------------ Disegno -------------------------------------
// Ogni sezione si ridisegna solo se cambia la sua "chiave": così chi sta
// scrivendo l'indizio non perde il testo quando arriva un aggiornamento.
const chiavi = {};
function sezione(id, chiave, html) {
  if (chiavi[id] === chiave) return;
  chiavi[id] = chiave;
  $("#" + id).innerHTML = typeof html === "function" ? html() : html;
}

const nomeDi = id => vista.giocatori.find(g => g.id === id)?.nome ?? "?";
const tu = id => id === vista.io ? " (tu)" : "";

function render() {
  if (!ruolo) return renderHome();
  sezione("s-rete", "r" + rete + codice, () => {
    if (rete === "ok") return "";
    if (ruolo === "host") return `<div class="rete">${rete === "attesa" ? "Apro la partita…" : "Connessione persa, riprovo…"}</div>`;
    if (rete === "assente") return `<div class="rete">Non trovo la partita <b>${esc(codice)}</b>. Il telefono di chi l'ha creata deve avere la pagina aperta. Riprovo…</div>`;
    return `<div class="rete">${rete === "attesa" ? "Mi collego alla partita…" : "Connessione persa, riprovo…"}</div>`;
  });
  sezione("s-testa", "t" + codice + mioNome + ruolo, `
    <header>
      <div class="chip-logo" aria-hidden="true">🕵️</div>
      <div><h1>L'impostore</h1><p>Partita <b>${esc(codice)}</b> · ${esc(mioNome)}${ruolo === "host" ? " (capo partita)" : ""}</p></div>
      <button class="link esci" data-act="esci">${ruolo === "host" ? "Chiudi" : "Esci"}</button>
    </header>`);
  if (!vista) {
    for (const id of ["s-carta", "s-gioco", "s-lista", "s-azioni"]) sezione(id, "vuoto", "");
    return;
  }
  renderCarta();
  renderGioco();
  renderLista();
  renderAzioni();
}

function renderHome() {
  const p = new URLSearchParams(location.search).get("p");
  const salvato = leggi("impostore-host");
  const recente = salvato && salvato.t && Date.now() - salvato.t < 12 * 3600e3;
  if (p) bozzaHome.codice = p.toUpperCase();
  sezione("s-testa", "home", `
    <header>
      <div class="chip-logo" aria-hidden="true">🕵️</div>
      <div><h1>L'impostore</h1><p>Chi ha visto un'altra immagine?</p></div>
    </header>`);
  sezione("s-gioco", "home" + !!p + !!recente, () => `
    <div class="card">
      <ol class="regole">
        <li>Ognuno vede sul telefono un'immagine segreta. È la stessa per tutti… <b>tranne uno, l'impostore</b>, che ne vede una simile ma diversa. E non sa di essere lui!</li>
        <li>A turno, ognuno scrive <b>una sola parola</b> sull'immagine: abbastanza per far capire che l'ha vista, ma non così chiara da svelarla all'impostore.</li>
        <li>Poi si discute e si vota: <b>chi è l'impostore?</b></li>
      </ol>
      <p class="small muted">Chi vota l'impostore prende 1 punto. Se l'impostore non è il più votato, prende 2 punti.</p>
      <label for="nome">Il tuo nome</label>
      <input type="text" id="nome" maxlength="${MAX_NOME}" autocomplete="given-name" value="${esc(bozzaHome.nome)}" placeholder="Per esempio: Giulia">
      ${p ? `
        <p class="small muted" style="margin-top:12px">Stai entrando nella partita <b>${esc(bozzaHome.codice)}</b>.</p>
        <button class="btn verde" data-act="entra">Entra nella partita</button>
        <input type="hidden" id="cod" value="${esc(bozzaHome.codice)}">` : `
        <button class="btn" data-act="crea">Crea una nuova partita</button>
        ${recente ? `<button class="btn chiaro" data-act="riprendi">Riprendi la partita ${esc(salvato.codice)}</button>` : ""}
        <h2>Oppure entra in una partita</h2>
        <label for="cod">Codice della partita</label>
        <input type="text" id="cod" class="codice" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(bozzaHome.codice)}" placeholder="ABCD">
        <button class="btn verde" data-act="entra">Entra</button>`}
    </div>`);
  for (const id of ["s-rete", "s-carta", "s-lista", "s-azioni"]) sezione(id, "home", "");
}

function qrSvg(testo) {
  try { const q = qrcode(0, "M"); q.addData(testo); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  catch { return ""; }
}

function renderCarta() {
  const v = vista;
  if (!v.mia) return sezione("s-carta", "no", "");
  const aperta = scoperta === v.round;
  sezione("s-carta", "carta" + v.round + aperta + v.mia.nome, aperta ? `
    <button class="carta polaroid" data-act="carta" aria-label="Copri l'immagine">
      <span class="foto"><span class="emoji">${v.mia.emoji}</span></span>
      <span class="nome-img">${esc(v.mia.nome)}</span>
      <div class="nota">Tocca per coprirla</div>
    </button>` : `
    <button class="carta coperta" data-act="carta" aria-label="Guarda l'immagine">
      <span class="timbro">Top secret</span>
      <span class="nome-img">La tua immagine</span>
      <div class="nota">Tocca per guardarla, senza farla vedere agli altri</div>
    </button>`);
}

function listaIndizi(v) {
  const detti = new Map(v.indizi.map(x => [x.id, x.p]));
  return `<ul class="indizi">${v.ordine.map(id => {
    const cls = detti.has(id) ? "" : id === v.turno ? "ora" : "dopo";
    const destra = detti.has(id) ? esc(detti.get(id)) : id === v.turno ? "sta pensando…" : v.fase === "indizi" ? "" : "saltato";
    return `<li class="${cls}"><span class="chi">${esc(nomeDi(id))}${tu(id)}</span><span class="parola">${destra}</span></li>`;
  }).join("")}</ul>`;
}

function renderGioco() {
  const v = vista;
  const io = v.giocatori.find(g => g.id === v.io);
  const fuori = v.fase !== "lobby" && v.fase !== "fine" && !io?.inRound
    ? `<div class="card"><p>Sei arrivato a round iniziato: giocherai dal prossimo round.</p></div>` : "";

  if (v.fase === "lobby") {
    if (ruolo === "host") {
      sezione("s-gioco", "invito" + codice, () => {
        const url = linkInvito();
        const msg = `Giochiamo all'impostore! Entra qui: ${url}`;
        const qr = qrSvg(url);
        return `<div class="card invito">
          <div class="label">Fai entrare gli altri</div>
          <div class="big">${esc(codice)}</div>
          ${qr ? `<div class="qr">${qr}</div><p class="small muted">Inquadra il QR con la fotocamera, oppure:</p>` : ""}
          <div class="riga">
            <a class="btn verde" style="text-decoration:none;text-align:center" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>
            <button class="btn chiaro" data-act="copia">Copia link</button>
          </div>
          <p class="small muted" style="margin-top:12px">Tieni questo telefono acceso con la pagina aperta: la partita vive qui.</p>
        </div>`;
      });
    } else {
      sezione("s-gioco", "attesa", `<div class="card"><p><b>Sei dentro!</b> Aspetta che il capo partita faccia iniziare il gioco.</p></div>`);
    }
    return;
  }

  if (v.fase === "fine") {
    const cl = v.giocatori.slice().sort((a, b) => b.punti - a.punti);
    const medaglie = ["🥇", "🥈", "🥉"];
    let pos = 0, prev = null;
    const righe = cl.map((g, i) => {
      if (g.punti !== prev) { pos = i; prev = g.punti; }
      return `<li><span>${medaglie[pos] || (pos + 1) + "°"}</span><span class="nome">${esc(g.nome)}${tu(g.id)}</span><span class="punti">${g.punti}</span></li>`;
    }).join("");
    sezione("s-gioco", "fine" + JSON.stringify(cl), `
      <h2>Classifica finale</h2>
      <div class="card"><ul class="giocatori">${righe}</ul></div>`);
    return;
  }

  const testa = `<div class="label">Round ${v.round}</div>`;

  if (v.fase === "indizi") {
    const mio = v.turno === v.io;
    // La parte con il campo di testo ha una chiave sua, così non si ridisegna mentre scrivo.
    sezione("s-gioco", "indizi" + JSON.stringify([v.round, v.turno, v.indizi, v.ordine, fuori]), () => `
      ${testa}
      <div class="domanda big">${mio ? "Tocca a te!" : v.turno ? `Tocca a <b>${esc(nomeDi(v.turno))}</b>` : "Indizi"}</div>
      ${fuori}
      ${mio ? `<div class="card">
        <label for="parola" style="margin-top:0">Il tuo indizio: una parola sola</label>
        <input type="text" id="parola" maxlength="${MAX_PAROLA}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(bozzaParola)}" placeholder="Una parola">
        <button class="btn verde" data-act="parola">Invia</button>
        <p class="small muted" style="margin-top:8px">Fai capire che hai visto l'immagine, ma senza svelarla a chi non l'ha vista.</p>
      </div>` : ""}
      <div class="card">${listaIndizi(v)}</div>`);
    if (mio) setTimeout(() => { const i = $("#parola"); if (i && document.activeElement !== i && !bozzaParola) i.focus({ preventScroll: true }); }, 0);
    return;
  }

  const detti = new Map(v.indizi.map(x => [x.id, x.p]));

  if (v.fase === "voto") {
    const on = v.giocatori.filter(g => g.inRound && g.online);
    const fatti = on.filter(g => g.votato).length;
    sezione("s-gioco", "voto" + JSON.stringify([v.round, v.mioVoto, fatti, on.length, v.indizi, fuori]), () => `
      ${testa}
      <div class="domanda big">Chi è l'impostore?</div>
      ${fuori}
      ${io?.inRound ? v.ordine.filter(id => id !== v.io).map(id => `
        <button class="sospetto${v.mioVoto === id ? " scelta" : ""}" data-act="voto" data-id="${esc(id)}">
          <span class="chi">${esc(nomeDi(id))}</span>
          <span class="parola">${esc(detti.get(id) ?? "—")}</span>
        </button>`).join("") : `<div class="card">${listaIndizi(v)}</div>`}
      <p class="small muted">${io?.inRound ? (v.mioVoto == null ? "Discutete, poi tocca chi secondo te è l'impostore. " : "Puoi cambiare idea finché non si svela. ") : ""}
        Il tuo indizio: <b>${esc(detti.get(v.io) ?? "—")}</b>. Hanno votato ${fatti} su ${on.length}.</p>`);
    return;
  }

  // svela
  const s = v.svela;
  const conta = {};
  for (const x of Object.values(s.voti)) conta[x] = (conta[x] || 0) + 1;
  const sonoImp = s.imp === v.io;
  const mioGuadagno = s.guadagni[v.io] || 0;
  let esito;
  if (sonoImp) esito = s.preso ? `<div class="esito no">Eri tu l'impostore… e ti hanno scoperto!</div>`
                               : `<div class="esito si">Eri tu l'impostore e l'hai fatta franca! +${mioGuadagno}</div>`;
  else esito = `<div class="esito ${s.preso ? "si" : "no"}">${s.preso ? "Caso risolto: impostore scoperto!" : "Caso aperto: l'impostore l'ha fatta franca!"}
    ${io?.inRound ? `<br><span class="small">${mioGuadagno ? `Hai votato giusto: +${mioGuadagno}` : v.mioVoto == null ? "Non hai votato" : "Hai votato la persona sbagliata"}</span>` : ""}</div>`;
  const perVoti = v.ordine.slice().sort((a, b) => (conta[b] || 0) - (conta[a] || 0));
  sezione("s-gioco", "svela" + JSON.stringify([v.round, s, v.mioVoto]), () => `
    ${testa}
    <div class="domanda big">L'impostore era <b>${esc(nomeDi(s.imp))}</b>${tu(s.imp)}</div>
    ${esito}
    <div class="coppia">
      <div class="card"><div class="label" style="color:var(--verde)">Ciurma</div><span class="emoji">${s.ciurma.emoji}</span><span class="nome-img">${esc(s.ciurma.nome)}</span></div>
      <div class="card imp"><div class="label">Impostore</div><span class="emoji">${s.impostore.emoji}</span><span class="nome-img">${esc(s.impostore.nome)}</span></div>
    </div>
    <h2>Voti</h2>
    ${perVoti.map(id => {
      const da = Object.entries(s.voti).filter(([, x]) => x === id).map(([k]) => nomeDi(k));
      return `<div class="sospetto${id === s.imp ? " imp" : ""}">
        <span class="chi">${esc(nomeDi(id))}${tu(id)}${id === s.imp ? `<span class="tag">IMPOSTORE</span>` : ""}
          <br><span class="small muted">${da.length ? "votato da " + da.map(esc).join(", ") : "nessun voto"}</span></span>
        <span class="parola">${esc(detti.get(id) ?? "—")}</span>
      </div>`;
    }).join("")}`);
}

function renderLista() {
  const v = vista;
  if (v.fase === "fine") return sezione("s-lista", "no", "");
  const ordinati = v.fase === "lobby" ? v.giocatori : v.giocatori.slice().sort((a, b) => b.punti - a.punti);
  const puoRimuovere = ruolo === "host" && !["indizi", "voto"].includes(v.fase);
  const righe = ordinati.map(g => {
    let stato = "";
    if (v.fase === "voto" && g.inRound) stato = g.votato ? `<span class="stato ok">ha votato ✓</span>` : `<span class="stato">sta votando</span>`;
    else if (v.fase !== "lobby" && v.fase !== "svela" && !g.inRound) stato = `<span class="stato">prossimo round</span>`;
    return `<li class="${g.online ? "" : "off"}">
      <span class="nome">${esc(g.nome)}${tu(g.id)}${g.id === v.host ? " 👑" : ""}${g.online ? "" : " · non collegato"}</span>
      ${stato}
      ${v.fase !== "lobby" ? `<span class="punti">${g.punti}</span>` : ""}
      ${puoRimuovere && !g.online ? `<button class="x" data-act="rimuovi" data-id="${esc(g.id)}" aria-label="Togli ${esc(g.nome)}">✕</button>` : ""}
    </li>`;
  }).join("");
  sezione("s-lista", "lista" + ruolo + JSON.stringify([v.fase, ordinati]), `
    <h2>${v.fase === "lobby" ? `Giocatori (${v.giocatori.length})` : "Punti"}</h2>
    <div class="card"><ul class="giocatori">${righe}</ul></div>`);
}

function renderAzioni() {
  const v = vista;
  if (ruolo !== "host") {
    const testo = v.fase === "svela" ? "Aspetta che il capo partita faccia partire il prossimo round."
                : v.fase === "fine" ? "Grazie per aver giocato!" : "";
    return sezione("s-azioni", "o" + testo, testo ? `<p class="small muted" style="text-align:center;margin-top:16px">${testo}</p>` : "");
  }
  const presenti = v.giocatori.filter(g => g.online).length;
  const pochi = presenti < MIN_GIOCATORI;
  const nota = pochi ? `<p class="small muted" style="margin-top:8px">Servono almeno ${MIN_GIOCATORI} giocatori collegati (ora ${presenti}).</p>` : "";
  let html = "";
  if (v.fase === "lobby") {
    html = `<button class="btn" data-act="inizia" ${pochi ? "disabled" : ""}>Inizia la partita</button>${nota}`;
  } else if (v.fase === "indizi") {
    const t = v.giocatori.find(g => g.id === v.turno);
    html = `<div class="riga">
        ${t && t.id !== v.io ? `<button class="btn chiaro" data-act="salta">Salta ${esc(t.nome)}</button>` : ""}
        <button class="btn chiaro" data-act="vota">Passa al voto</button>
      </div>`;
  } else if (v.fase === "voto") {
    html = `<button class="btn" data-act="svela">Svela l'impostore</button>`;
  } else if (v.fase === "svela") {
    html = `<button class="btn" data-act="inizia" ${pochi ? "disabled" : ""}>Prossimo round</button>${nota}
      <button class="btn chiaro" data-act="fine">Fine partita</button>`;
  } else {
    html = `<button class="btn" data-act="ancora">Gioca ancora</button>
      <p class="small muted" style="margin-top:8px">Stessi giocatori, punti azzerati.</p>`;
  }
  sezione("s-azioni", "h" + html, html);
}

// ------------------------------ Avvio ---------------------------------------
(function avvio() {
  if (typeof Peer === "undefined") {
    document.querySelector("main").innerHTML = `<div class="card">Non riesco a caricare il gioco: controlla la connessione a internet e ricarica la pagina.</div>`;
    return;
  }
  const r = leggi("impostore-ruolo", sessionStorage);   // ricaricamento della stessa scheda
  const p = (new URLSearchParams(location.search).get("p") || "").toUpperCase();
  if (r?.ruolo === "host" && leggi("impostore-host")?.codice === r.codice && mioNome) return avviaHost(leggi("impostore-host"));
  if (r?.ruolo === "ospite" && r.codice === p && mioNome) return avviaOspite(p);
  render();
})();
</script>
</body>
</html>
